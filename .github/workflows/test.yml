name: Test KOREK Blockchain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/storage.js
      - run: node --check public/app.js
      - run: node --check scripts/key.mjs
      - run: node --check scripts/miner.mjs
      - run: node --check scripts/node-key.mjs
      - run: node --check src/protocol.js
      - run: node --check src/miner-auth.js
      - run: node --check src/p2p.js
