name: Build Planck Node Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Require replay-verified ledger state before release builds
        run: node scripts/security-gate.mjs
      - run: node --check src/server.js
      - run: node --check src/mining-protocol.js
      - run: node --check src/miner-auth.js
      - run: node --check src/p2p.js
      - run: node --check scripts/node-key.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: bun-linux-x64, platform: linux-x64, extension: "" }
          - { target: bun-windows-x64, platform: windows-x64, extension: ".exe" }
          - { target: bun-darwin-arm64, platform: mac-arm64, extension: "" }
          - { target: bun-darwin-x64, platform: mac-x64, extension: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Compile executables
        run: |
          mkdir -p "dist/${{ matrix.platform }}/public"
          bun build src/server.js --compile --target=${{ matrix.target }} --outfile="dist/${{ matrix.platform }}/korek-node${{ matrix.extension }}"
          bun build scripts/node-key.mjs --compile --target=${{ matrix.target }} --outfile="dist/${{ matrix.platform }}/korek-node-key${{ matrix.extension }}"
          bun build scripts/key.mjs --compile --target=${{ matrix.target }} --outfile="dist/${{ matrix.platform }}/korek-key${{ matrix.extension }}"
          cp public/* "dist/${{ matrix.platform }}/public/"
          cp docs/MINING_AND_NODE.md "dist/${{ matrix.platform }}/README.md"
      - name: Package Unix distribution
        if: matrix.platform != 'windows-x64'
        run: |
          chmod +x dist/${{ matrix.platform }}/korek-*
          tar -czf "korek-planck-0.7.1-${{ matrix.platform }}.tar.gz" -C "dist/${{ matrix.platform }}" .
      - name: Package Windows distribution
        if: matrix.platform == 'windows-x64'
        run: cd "dist/${{ matrix.platform }}" && 7z a "../../korek-planck-0.7.1-${{ matrix.platform }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: korek-planck-0.7.1-*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: planck-testnet-latest
          name: KOREK Planck Testnet Node v0.7.1
          prerelease: true
          make_latest: false
          files: artifacts/korek-planck-0.7.1-*
