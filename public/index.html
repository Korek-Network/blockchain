<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7f6">
  <meta name="description" content="KOREKScan explorer and live analytics for the KOREK Planck network.">
  <title>KOREKScan — Planck Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="KOREKScan home"><span class="brand-mark">K</span><span>KOREK<b>SCAN</b></span></a>
    <nav aria-label="Explorer navigation">
      <a href="#/transactions" data-nav="transactions">Transactions</a>
      <a href="#/analytics" data-nav="analytics">Analytics</a>
      <a href="#/nodes" data-nav="nodes">Nodes</a>
      <a href="#/blocks" data-nav="blocks">Blocks</a>
      <a href="#/mining" data-nav="mining">Mining</a>
    </nav>
    <div class="top-actions">
      <span class="network-select"><i id="networkDot"></i><span id="networkName">Connecting</span><b>Planck Testnet</b></span>
      <button id="themeButton" class="icon-button" aria-label="Toggle theme">◐</button>
      <button id="menuButton" class="icon-button menu-button" aria-label="Open navigation">☰</button>
    </div>
  </header>
  <div class="search-wrap">
    <form id="searchForm" class="search" role="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" autocomplete="off" spellcheck="false" placeholder="Search address, transaction hash, block height or block hash">
      <kbd>/</kbd>
    </form>
    <p id="searchError" class="search-error" aria-live="polite"></p>
  </div>
  <main id="main">
    <header class="page-head">
      <div><p id="pageEyebrow" class="eyebrow">PLANCK TESTNET</p><h1 id="pageTitle">Network overview</h1><p id="pageSubtitle">Live blocks, transactions and mining activity.</p></div>
      <span id="liveBadge" class="live-badge"><i></i> Live</span>
    </header>
    <div id="content"></div>
  </main>
  <footer><a class="brand mini" href="#/"><span class="brand-mark">K</span><span>KOREK<b>SCAN</b></span></a><span id="footerStatus">Planck testnet explorer</span><a href="https://github.com/Korek-Network/blockchain">Source code ↗</a></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
